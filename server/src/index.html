<script type="importmap">
  {
    "imports": {
      "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
    }
  }
</script>

<div id="app">
  <div
    v-for="c, i in clients"
    key="c.id"
    style="width: 300px; display: flex; justify-content: space-between;"
  >
    <p>Client {{ i + 1 }}</p>
    <button @click="() => disconnect(c.id)">Disconnect</button>
  </div>
</div>

<script type="module">
  import { createApp, ref } from 'vue'

  createApp({
    setup(){
      const clients = ref([])
      fetch('/clients').then(res => res.json()).then(c => clients.value = c)

      const disconnect = (id) => fetch(`/clients/${id}`, {
        method: 'DELETE'
      })

      return {
        clients,
        disconnect
      }
    }
  }).mount('#app')
</script>
